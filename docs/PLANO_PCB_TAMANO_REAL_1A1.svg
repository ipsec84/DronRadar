<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160mm" height="160mm">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
    </pattern>
    <style>
      .dim-line { stroke: #dc2626; stroke-width: 0.5; marker-end: url(#arrow); marker-start: url(#arrow); }
      .dim-text { font-family: monospace; font-size: 3.5px; fill: #b91c1c; font-weight: bold; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 3px; fill: #1e293b; font-weight: bold; }
      .sublabel { font-family: monospace; font-size: 2px; fill: #64748b; }
      .pcb-edge { fill: #0f3822; stroke: #15803d; stroke-width: 1.2; rx: 8; ry: 8; }
      .pcb-inner { fill: #12472b; stroke: #1e6b3e; stroke-width: 0.5; rx: 6; ry: 6; }
      .copper-trace { stroke: #ca8a04; stroke-width: 0.6; fill: none; opacity: 0.7; }
      .hole { fill: #ffffff; stroke: #94a3b8; stroke-width: 0.6; }
      .mount-hole { fill: #ffffff; stroke: #ca8a04; stroke-width: 1.2; }
      .mic-pad { fill: #eab308; stroke: #ca8a04; stroke-width: 0.4; }
      .chip { fill: #1e293b; stroke: #475569; stroke-width: 0.5; rx: 1; ry: 1; }
      .pin { fill: #cbd5e1; stroke: #64748b; stroke-width: 0.2; }
    </style>
    <marker id="arrow" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1.5 L 4.5 3 L 0 4.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- FONDO CON CUADRÍCULA MILIMÉTRICA 1:1 -->
  <rect x="0" y="0" width="160" height="160" fill="#f8fafc"/>
  <rect x="15" y="15" width="130" height="130" fill="url(#grid)"/>

  <!-- CONTORNO DE LA PCB DRONRADAR (120 x 120 mm) -->
  <!-- Centrada: de x=20 a x=140, y=20 a y=140 -->
  <rect x="20" y="20" width="120" height="120" class="pcb-edge"/>
  <rect x="23" y="23" width="114" height="114" class="pcb-inner"/>

  <!-- AGUJEROS DE MONTAJE M3 EN LAS 4 ESQUINAS (Separación 108 x 108 mm) -->
  <circle cx="26" cy="26" r="1.6" class="mount-hole"/>
  <circle cx="134" cy="26" r="1.6" class="mount-hole"/>
  <circle cx="26" cy="134" r="1.6" class="mount-hole"/>
  <circle cx="134" cy="134" r="1.6" class="mount-hole"/>

  <!-- MATRIZ DE 4 MICRÓFONOS EN CUADRADO EXACTO 70 x 70 mm (DISTANCIA ÓPTIMA ANTI-ALIASING) -->
  <!-- Centro de la placa: cx=80, cy=80. Micrófonos a +/- 35 mm del centro -->
  <!-- M1 (Delantero Izq / NOROESTE): (45, 45) -->
  <!-- M2 (Delantero Der / NORESTE):  (115, 45) -->
  <!-- M3 (Trasero Izq / SUROESTE):    (45, 115) -->
  <!-- M4 (Trasero Der / SURESTE):     (115, 115) -->

  <!-- LÍNEAS DE EJES ACÚSTICOS ORTOGONALES (Eje X y Eje Y) -->
  <line x1="45" y1="80" x2="115" y2="80" stroke="#22c55e" stroke-width="0.3" stroke-dasharray="2,2"/>
  <line x1="80" y1="45" x2="80" y2="115" stroke="#22c55e" stroke-width="0.3" stroke-dasharray="2,2"/>
  <line x1="45" y1="45" x2="115" y2="115" stroke="#38bdf8" stroke-width="0.2" stroke-dasharray="1,2"/>
  <line x1="115" y1="45" x2="45" y2="115" stroke="#38bdf8" stroke-width="0.2" stroke-dasharray="1,2"/>

  <!-- MÓDULO MICRÓFONO 1 (M1 - Bus A Left - GPIO 6) -->
  <rect x="39" y="39" width="12" height="12" fill="#0f172a" stroke="#eab308" stroke-width="0.6" rx="1.5"/>
  <circle cx="45" cy="45" r="1.2" class="hole"/>
  <text x="45" y="36" class="label" fill="#facc15" text-anchor="middle">M1 (BUS A - L)</text>
  <text x="45" y="55" class="sublabel" fill="#94a3b8" text-anchor="middle">GPIO4,5,6</text>

  <!-- MÓDULO MICRÓFONO 2 (M2 - Bus A Right - GPIO 6) -->
  <rect x="109" y="39" width="12" height="12" fill="#0f172a" stroke="#eab308" stroke-width="0.6" rx="1.5"/>
  <circle cx="115" cy="45" r="1.2" class="hole"/>
  <text x="115" y="36" class="label" fill="#facc15" text-anchor="middle">M2 (BUS A - R)</text>
  <text x="115" y="55" class="sublabel" fill="#94a3b8" text-anchor="middle">GPIO4,5,6</text>

  <!-- MÓDULO MICRÓFONO 3 (M3 - Bus B Left - GPIO 9) -->
  <rect x="39" y="109" width="12" height="12" fill="#0f172a" stroke="#eab308" stroke-width="0.6" rx="1.5"/>
  <circle cx="45" cy="115" r="1.2" class="hole"/>
  <text x="45" y="106" class="label" fill="#facc15" text-anchor="middle">M3 (BUS B - L)</text>
  <text x="45" y="125" class="sublabel" fill="#94a3b8" text-anchor="middle">GPIO7,8,9</text>

  <!-- MÓDULO MICRÓFONO 4 (M4 - Bus B Right - GPIO 9) -->
  <rect x="109" y="109" width="12" height="12" fill="#0f172a" stroke="#eab308" stroke-width="0.6" rx="1.5"/>
  <circle cx="115" cy="115" r="1.2" class="hole"/>
  <text x="115" y="106" class="label" fill="#facc15" text-anchor="middle">M4 (BUS B - R)</text>
  <text x="115" y="125" class="sublabel" fill="#94a3b8" text-anchor="middle">GPIO7,8,9</text>

  <!-- SOCKET CENTRAL: ESP32-S3 DEVKITC-1 (28 x 48 mm) -->
  <rect x="66" y="56" width="28" height="48" class="chip"/>
  <!-- Tiras de pines laterales del ESP32-S3 -->
  <rect x="66" y="58" width="2.5" height="44" fill="#334155" stroke="#94a3b8" stroke-width="0.3"/>
  <rect x="91.5" y="58" width="2.5" height="44" fill="#334155" stroke="#94a3b8" stroke-width="0.3"/>
  <!-- Antena PCB WiFi del ESP32 -->
  <rect x="71" y="57" width="18" height="8" fill="#ca8a04" opacity="0.4" rx="1"/>
  <text x="80" y="75" class="label" fill="#f8fafc" text-anchor="middle">ESP32-S3</text>
  <text x="80" y="80" class="sublabel" fill="#94a3b8" text-anchor="middle">DevKitC-1 N8R8</text>
  <text x="80" y="85" class="sublabel" fill="#38bdf8" text-anchor="middle">Dual I2S Core</text>

  <!-- HUECO MÓDULO LORA SPI (SX1262 / RFM95) -->
  <rect x="64" y="107" width="32" height="16" fill="#1e293b" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="1.5,1.5" rx="1"/>
  <text x="80" y="115" class="label" fill="#38bdf8" text-anchor="middle">SLOT LORA (SX1262)</text>
  <text x="80" y="120" class="sublabel" fill="#94a3b8" text-anchor="middle">SPI: GPIO 10, 13, 14</text>

  <!-- BORNERA DE ALIMENTACIÓN 5V / FUENTE MEAN WELL RS-15-5 -->
  <rect x="67" y="25" width="26" height="10" fill="#1e40af" stroke="#93c5fd" stroke-width="0.5" rx="1"/>
  <circle cx="72" cy="30" r="1.5" fill="#f8fafc"/>
  <circle cx="80" cy="30" r="1.5" fill="#f8fafc"/>
  <circle cx="88" cy="30" r="1.5" fill="#f8fafc"/>
  <text x="72" y="37" class="sublabel" fill="#fff" text-anchor="middle">+5V</text>
  <text x="80" y="37" class="sublabel" fill="#fff" text-anchor="middle">GND</text>
  <text x="88" y="37" class="sublabel" fill="#fff" text-anchor="middle">VIN</text>
  <text x="80" y="24" class="label" fill="#60a5fa" text-anchor="middle">ENTRADA ALIMENTACIÓN 5V</text>

  <!-- ========================================== -->
  <!-- COTAS Y DIMENSIONES MECÁNICAS (MILÍMETROS) -->
  <!-- ========================================== -->

  <!-- COTA TOTAL ANCHO PCB: 120 mm -->
  <line x1="20" y1="12" x2="140" y2="12" class="dim-line"/>
  <line x1="20" y1="10" x2="20" y2="18" stroke="#dc2626" stroke-width="0.4"/>
  <line x1="140" y1="10" x2="140" y2="18" stroke="#dc2626" stroke-width="0.4"/>
  <text x="80" y="9" class="dim-text">120.0 mm (ANCHO PCB)</text>

  <!-- COTA TOTAL ALTO PCB: 120 mm -->
  <line x1="148" y1="20" x2="148" y2="140" class="dim-line"/>
  <line x1="142" y1="20" x2="150" y2="20" stroke="#dc2626" stroke-width="0.4"/>
  <line x1="142" y1="140" x2="150" y2="140" stroke="#dc2626" stroke-width="0.4"/>
  <text x="154" y="82" class="dim-text" transform="rotate(90, 154, 82)">120.0 mm</text>

  <!-- COTA SEPARACIÓN ÓPTIMA ENTRE MICRÓFONOS: 70.0 mm (EJE X) -->
  <line x1="45" y1="145" x2="115" y2="145" class="dim-line"/>
  <line x1="45" y1="138" x2="45" y2="148" stroke="#dc2626" stroke-width="0.4"/>
  <line x1="115" y1="138" x2="115" y2="148" stroke="#dc2626" stroke-width="0.4"/>
  <text x="80" y="151" class="dim-text">70.0 mm (SEPARACIÓN ÓPTIMA X: M1 ↔ M2)</text>

  <!-- COTA SEPARACIÓN ÓPTIMA ENTRE MICRÓFONOS: 70.0 mm (EJE Y) -->
  <line x1="12" y1="45" x2="12" y2="115" class="dim-line"/>
  <line x1="10" y1="45" x2="18" y2="45" stroke="#dc2626" stroke-width="0.4"/>
  <line x1="10" y1="115" x2="18" y2="115" stroke="#dc2626" stroke-width="0.4"/>
  <text x="7" y="80" class="dim-text" transform="rotate(-90, 7, 80)">70.0 mm (Y: M1 ↔ M3)</text>

  <!-- COTA DIAGONAL ACÚSTICA: 99.0 mm -->
  <text x="96" y="96" class="sublabel" fill="#38bdf8" transform="rotate(45, 96, 96)">Diagonal = 98.99 mm (λ/2 @ 1730 Hz)</text>

  <!-- ROSA DE LOS VIENTOS / ORIENTACIÓN EN CAMPO -->
  <g transform="translate(35, 80)">
    <circle cx="0" cy="0" r="5" fill="#0f172a" stroke="#475569" stroke-width="0.4"/>
    <text x="0" y="-1.5" class="sublabel" fill="#ef4444" text-anchor="middle" font-weight="bold">▲ N (0°)</text>
    <text x="0" y="3" class="sublabel" fill="#94a3b8" text-anchor="middle">Cielo</text>
  </g>

  <!-- LEYENDA TÉCNICA -->
  <text x="25" y="137" class="sublabel" fill="#6ee7b7">ESCALA 1:1 REAL (160 x 160 mm) | CUMPLE CRITERIO NYQUIST ESPACIAL f &lt; 2.4 kHz</text>
</svg>
